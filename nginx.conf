events {}

http {
    upstream test_servers {
        server test-backend-1:8080 max_fails=3 fail_timeout=30s;
        server test-backend-2:8080 max_fails=3 fail_timeout=30s backup;
    }

    upstream beta_servers {
        server beta-backend-1:8080 max_fails=3 fail_timeout=30s;
        server beta-backend-2:8080 max_fails=3 fail_timeout=30s backup;
    }

    server {
        listen 80;
        server_name test.example.com;
        location / { proxy_pass http://test_servers; }
    }

    server {
        listen 80;
        server_name beta.example.com;
        location / { proxy_pass http://beta_servers; }
    }
}
